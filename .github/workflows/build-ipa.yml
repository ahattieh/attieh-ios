name: Build Attieh IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS packages
        run: npm install --no-audit --no-fund

      - name: Prepare iOS project (pods incl. VLC)
        run: npx cap sync ios

      - name: Build unsigned app
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 60

      - name: Package IPA
        working-directory: ios/App
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry Attieh.ipa Payload
          ls -la Attieh.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Attieh-ipa
          path: ios/App/Attieh.ipa

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Attieh build ${{ github.run_number }}
          files: ios/App/Attieh.ipa
