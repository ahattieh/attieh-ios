<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>promo</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p,iframe{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;border:0}</style>
</head><body><div id="p"></div>
<script>
/* Amira / Attieh promo player. Apps open this page in an iframe (?v=VIDEO_ID); it embeds YouTube from a real
   https origin (YouTube refuses embeds with no referrer — error 153) and reports state back with postMessage. */
var q = new URLSearchParams(location.search), id = q.get('v') || '', mute = q.get('mute') === '1';
function tell(m) { m.amira = 'yt'; m.v = id; try { parent.postMessage(m, '*'); } catch (e) {} }
if (!/^[\w-]{11}$/.test(id)) tell({ error: 'bad-id' });
var player;
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('p', {
    width: "100%", height: "100%", videoId: id, host: 'https://www.youtube.com',
    playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, loop: 1, playlist: id, iv_load_policy: 3, disablekb: 1, fs: 0, origin: location.origin },
    events: {
      onReady: function (e) { if (mute) e.target.mute(); e.target.playVideo(); tell({ ready: 1 }); },
      onStateChange: function (e) { tell({ state: e.data }); },
      onError: function (e) { tell({ error: e.data }); }
    }
  });
};
window.addEventListener('message', function (e) {
  var d = e.data; if (!d || d.amira !== 'cmd' || !player) return;
  if (d.cmd === 'stop') player.stopVideo(); else if (d.cmd === 'mute') player.mute(); else if (d.cmd === 'unmute') player.unMute();
});
var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
s.onerror = function () { tell({ error: 'api-load' }); };
document.head.appendChild(s);
</script></body></html>
