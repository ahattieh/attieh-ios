<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>promo</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p,iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}.hq #p,.hq iframe{transform-origin:0 0;-webkit-transform-origin:0 0}</style>
</head><body><div id="p"></div>
<script>
/* Amira / Attieh promo player. Apps open this page in an iframe (?v=VIDEO_ID); it embeds YouTube from a real
   https origin (YouTube refuses embeds with no referrer — error 153) and reports state back with postMessage. */
var q = new URLSearchParams(location.search), id = q.get('v') || '', mute = q.get('mute') !== '0', hq = q.get('hq') !== '0', loop = q.get('loop') === '1';
/* YouTube picks quality from the player's size: draw it at double size and shrink it, so it streams HD */
/* size the player to ~1920 real pixels (1080p) — bigger makes YouTube send 1440p/4K, too heavy for a TV */
if (hq) {
  var k = Math.min(2, Math.max(0.5, 1920 / ((window.innerWidth || 1920) * (window.devicePixelRatio || 1))));
  if (Math.abs(k - 1) > 0.05) {
    var st = document.createElement('style'); st.textContent = '.hq #p,.hq iframe{width:' + (k * 100) + '%;height:' + (k * 100) + '%;transform:scale(' + (1 / k) + ');-webkit-transform:scale(' + (1 / k) + ')}';
    document.head.appendChild(st); document.documentElement.className = 'hq';
  }
}
function tell(m) { m.amira = 'yt'; m.v = id; try { if (player && player.getPlaybackQuality) { m.q = player.getPlaybackQuality(); var lv = player.getAvailableQualityLevels && player.getAvailableQualityLevels(); if (lv && lv.length) m.max = lv[0] === 'auto' ? lv[1] : lv[0]; } } catch (e) {} try { parent.postMessage(m, '*'); } catch (e) {} }
if (id && !/^[\w-]{11}$/.test(id)) tell({ error: 'bad-id' });          // no id = warm-up: load the player now, the promo comes later
var player;
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('p', {
    width: "100%", height: "100%", videoId: id || undefined, host: 'https://www.youtube-nocookie.com',
    playerVars: { autoplay: 1, mute: mute ? 1 : 0, vq: 'hd1080', controls: 0, rel: 0, modestbranding: 1, playsinline: 1, loop: loop ? 1 : 0, playlist: loop ? id : undefined, iv_load_policy: 3, disablekb: 1, fs: 0, origin: location.origin },
    events: {
      onReady: function (e) { if (mute) e.target.mute(); if (!id) { tell({ ready: 1, warm: 1 }); return; } try { e.target.setPlaybackQuality('hd1080'); } catch (x) {} e.target.playVideo(); tell({ ready: 1 }); },
      onPlaybackQualityChange: function (e) { tell({ quality: e.data }); },
      onStateChange: function (e) {
        var m = { state: e.data };
        if (e.data === 1) {
          try { e.target.setPlaybackQuality('hd1080'); } catch (x) {}
          try { var vd = e.target.getVideoData && e.target.getVideoData(); if (vd && vd.video_id && vd.video_id !== id) m.ad = 1; } catch (x) {}
        }
        tell(m);
      },
      onError: function (e) { tell({ error: e.data }); }
    }
  });
};
/* ads never get sound: while anything other than the promo plays the player stays muted, and the app is told */
var wantSound = false, inAd = false;
function vdata() { try { return (player.getVideoData && player.getVideoData()) || {}; } catch (e) { return {}; } }
function isAd() { var vd = vdata(); return !!(vd.video_id && vd.video_id !== id); }
/* no sound unless we're sure it's the promo itself (an ad, or a player that hasn't said what it plays yet, stays silent) */
function unsure() { var vd = vdata(); return isAd() || !vd.title || inAd || !everMoved; }
/* An ad inside the embed often keeps the promo's own id/title, so it can't be told apart by name.
   But the promo's own clock doesn't move while an ad runs: "playing" (or stuck loading) with a frozen clock = not the promo.
   Then: silent at once, and the app is told so it closes the player. */
var lastT = -1, frozen = 0, readyAt = 0, everMoved = false;
function contentStuck() {
  var st = -2, t = 0; try { st = player.getPlayerState(); t = player.getCurrentTime() || 0; } catch (e) { return false; }
  var moved = t > lastT + 0.05; lastT = t;
  if (moved) { frozen = 0; everMoved = true; return false; }
  if (st === 1 || ((st === 3 || st === -1) && readyAt && Date.now() - readyAt > 2500 && !everMoved)) frozen++;
  return frozen >= 4;                                      // ~1.2 s with the promo's clock not moving
}
setInterval(function () {
  if (!player || !player.getPlayerState) return;
  if (!readyAt && player.getPlayerState() !== -2) readyAt = Date.now();
  var ad = isAd() || contentStuck();
  if (unsure()) { try { player.mute(); } catch (e) {} }
  else if (wantSound) { try { if (player.isMuted()) { player.unMute(); player.setVolume(100); } } catch (e) {} }
  if (ad !== inAd) { inAd = ad; tell(ad ? { ad: 1 } : { adEnd: 1 }); }
}, 300);
window.addEventListener('message', function (e) {
  var d = e.data; if (!d || d.amira !== 'cmd' || !player) return;
  if (d.cmd === 'stop') { wantSound = false; try { player.mute(); player.stopVideo(); } catch (x) {} }
  else if (d.cmd === 'load' && /^[\w-]{11}$/.test(d.v || '')) {          // reuse this page for another promo: no reload, no freeze
    id = d.v; wantSound = false; inAd = false; lastT = -1; frozen = 0; everMoved = false; readyAt = Date.now();
    try { player.mute(); player.loadVideoById({ videoId: id, suggestedQuality: 'hd1080' }); } catch (x) {}
    tell({ ready: 1 });
  }
  else if (d.cmd === 'mute') { wantSound = false; player.mute(); }
  else if (d.cmd === 'unmute') { wantSound = true; if (!unsure()) { player.unMute(); player.setVolume(100); } }
});
var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
s.onerror = function () { tell({ error: 'api-load' }); };
document.head.appendChild(s);
</script></body></html>
